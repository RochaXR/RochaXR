name: Atualizar README com repositórios recentes

on:
  schedule:
    - cron: '0 */12 * * *' # Roda automaticamente a cada 12 horas
  workflow_dispatch: # Permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar lista de repositórios no README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              sort: 'updated',
              per_page: 6
            });

            const filtered = repos
              .filter(r => r.name !== context.repo.owner && !r.fork)
              .slice(0, 5);

            const list = filtered.length
              ? filtered.map(r => `- **[${r.name}](${r.html_url})** — ${r.description || 'Projeto em desenvolvimento'}`).join('\n')
              : '*Nenhum repositório público além do perfil ainda — em breve novos projetos!*';

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- REPOS:START -->[\s\S]*?<!-- REPOS:END -->/,
              `<!-- REPOS:START -->\n${list}\n<!-- REPOS:END -->`
            );
            fs.writeFileSync('README.md', readme);

      - name: Salvar alterações se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza repositórios recentes no README" && git push)
